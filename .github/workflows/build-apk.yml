
name: Build LSPatch APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build LSPatch
        run: |
          chmod +x gradlew
          ./gradlew buildDebug

      - name: Find build files
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk"
          echo "=== JAR files ==="
          find . -type f -name "*.jar"

      - name: Upload APK and JAR
        uses: actions/upload-artifact@v4
        with:
          name: LSPatch-Build
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/libs/*.jar
          if-no-files-found: error
